[package]
name = "obs-touch-control"
version = "0.1.0"
edition = "2024"
description = "Touch-friendly OBS Studio remote control (scenes, outputs, hotkeys, audio)"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
obws = { version = "0.15", features = ["events"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
futures-util = "0.3"

[profile.release]
lto = true
strip = true
